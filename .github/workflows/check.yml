name: Check shared Skill candidate
# Manual only: explain the need and obtain user approval before each Actions run.
on:
  workflow_dispatch:
    inputs:
      approval_reason:
        description: User-approved reason for this exact run (include approval reference)
        required: true
        type: string

permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 -m unittest discover -s tests
